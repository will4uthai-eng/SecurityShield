name: Build SecurityShield APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Build APK
      run: |
        chmod +x ./gradlew
        ./gradlew build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SecurityShield-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: build-${{ github.run_number }}
        body: |
          ✅ SecurityShield APK Build Successful!

          **App Features:**
          - Elegant security dashboard
          - Persistent memory (remembers scan history)
          - Real-time security checks
          - Premium UI design

          **Installation:**
          1. Download the APK file
          2. Transfer to your Android device
          3. Tap to install (you may need to enable "Unknown Sources")
          4. Open SecurityShield!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
